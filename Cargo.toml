[package]
name = "cc-switch-tui"
version = "0.1.1"
edition = "2024"
default-run = "cc-switch-tui"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
ratatui = "0.26"
crossterm = "0.27"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "migrate_instances_id"
path = "tools/migrate_instances_id.rs"
